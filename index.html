<script>
(function(){

"use strict";

/* =========================================================
   CONFIGURATION
   ========================================================= */

var CONFIG = {

  sources:[
    {
      url:"https://naka.marketing2advertising.com",
      kind:"movie"
    },
    {
      url:"https://serie.marketing2advertising.com",
      kind:"series"
    }
  ],

  pageSize:50,
  maxPages:4,
  adEvery:12,
  timeout:8000

};


/* =========================================================
   STATE
   ========================================================= */

var state = {

  items:[],

  filter:"all",

  query:"",

  loaded:false,

  backgroundLoading:false,

  viewing:null,

  previousScroll:0

};


/* =========================================================
   DOM
   ========================================================= */

var catalog =
  document.getElementById("m2a-catalog");

var postView =
  document.getElementById("m2a-post-view");

var searchInput =
  document.getElementById("m2a-search");

var countBox =
  document.getElementById("m2a-count");


/* =========================================================
   JSONP LOADER
   ========================================================= */

function jsonp(url){

  return new Promise(function(resolve,reject){

    var callbackName =
      "m2a_jsonp_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);

    var script =
      document.createElement("script");

    var finished = false;

    var timer =
      setTimeout(function(){

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error("Feed timeout")
        );

      },CONFIG.timeout);


    function cleanup(){

      clearTimeout(timer);

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

    }


    window[callbackName] =
      function(data){

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error("Feed error")
        );

      };


    script.src =
      url +
      (url.indexOf("?") > -1 ? "&" : "?") +
      "alt=json-in-script" +
      "&callback=" +
      callbackName;

    script.async = true;

    document.head.appendChild(script);

  });

}


/* =========================================================
   CLEAN TEXT
   ========================================================= */

function cleanText(html){

  if(!html){
    return "";
  }

  var box =
    document.createElement("div");

  box.innerHTML = html;

  return (
    box.textContent ||
    box.innerText ||
    ""
  )
  .replace(/\s+/g," ")
  .trim();

}


/* =========================================================
   EXTRACT IMAGE
   ========================================================= */

function extractImage(entry,size){

  var target=
    size || "s480";


  if(
    entry &&
    entry.media$thumbnail &&
    entry.media$thumbnail.url
  ){

    return entry.media$thumbnail.url
      .replace(/\/s[0-9]+(-c)?\//,"/"+target+"/");
  }


  var html =
    entry &&
    entry.content &&
    entry.content.$t
      ? entry.content.$t
      : "";


  var box =
    document.createElement("div");

  box.innerHTML = html;


  var image =
    box.querySelector("img");


  return image
    ? image.src
    : "";

}


/* =========================================================
   EXTRACT TITLE
   ========================================================= */

function extractTitle(entry){

  return (
    entry &&
    entry.title &&
    entry.title.$t
  )
  ? entry.title.$t.trim()
  : "Untitled";

}


/* =========================================================
   EXTRACT ID
   ========================================================= */

function extractId(entry){

  if(
    entry &&
    entry.id &&
    entry.id.$t
  ){

    var id =
      entry.id.$t;

    var match =
      id.match(/post-(\d+)/);

    if(match){
      return "post-" + match[1];
    }

    return id;
  }

  return "";

}


/* =========================================================
   CONVERT FEED ENTRIES
   ========================================================= */

function convertEntries(
  data,
  source
){

  if(
    !data ||
    !data.feed ||
    !data.feed.entry
  ){

    return [];
  }


  return data.feed.entry.map(
    function(entry){

      var html =
        entry.content &&
        entry.content.$t
          ? entry.content.$t
          : (
              entry.summary &&
              entry.summary.$t
                ? entry.summary.$t
                : ""
            );


      var published =
        entry.published &&
        entry.published.$t
          ? entry.published.$t
          : "";


      var date = "";

      if(published){

        try{

          date =
            new Date(published)
              .getFullYear();

        }catch(e){

          date = "";

        }

      }


      var title =
        extractTitle(entry);


      var item = {

        id:extractId(entry),

        title:title,

        image:extractImage(entry),

        content:cleanText(html),

        sourceUrl:source.url,

        kind:source.kind,

        year:date,

        published:published,

        vj:""

      };


      /*
       * Try to extract VJ information from title/content.
       */

      var combined =
        title + " " + item.content;


      var vjMatch =
        combined.match(
          /\b(?:kali\s+mu|vj)\s+([A-Za-z0-9 _.-]{2,40})/i
        );


      if(vjMatch){

        item.vj =
          vjMatch[1]
            .replace(/\s+/g," ")
            .trim();

      }


      return item;

    }
  );

}


/* =========================================================
   LOAD ONE FEED PAGE
   ========================================================= */

function loadPage(
  source,
  page
){

  var url =
    source.url +
    "/feeds/posts/default" +
    "?alt=json-in-script" +
    "&max-results=" +
    CONFIG.pageSize +
    "&start-index=" +
    (
      ((page - 1) *
      CONFIG.pageSize) + 1
    );


  return jsonp(url)
    .then(function(data){

      return convertEntries(
        data,
        source
      );

    })
    .catch(function(){

      return [];

    });

}


/* =========================================================
   DEDUPLICATE
   ========================================================= */

function dedupe(items){

  var seen =
    new Set();

  var result = [];


  items.forEach(function(item){

    var key =
      item.sourceUrl +
      "|" +
      item.id;


    if(seen.has(key)){
      return;
    }


    seen.add(key);

    result.push(item);

  });


  return result;

}


/* =========================================================
   LOAD FIRST PAGES
   ========================================================= */

function loadFirstPages(){

  Promise.all(

    CONFIG.sources.map(
      function(source){

        return loadPage(
          source,
          1
        );

      }
    )

  )
  .then(function(results){

    var merged = [];

    results.forEach(
      function(items){

        merged =
          merged.concat(items);

      }
    );


    state.items =
      dedupe(merged);


    state.loaded = true;

    render();


    /*
     * Continue loading more pages in background.
     */

    loadBackgroundPages();

  })
  .catch(function(){

    state.loaded = true;

    render();

  });

}


/* =========================================================
   BACKGROUND PAGE LOADING
   ========================================================= */

function loadBackgroundPages(){

  if(state.backgroundLoading){
    return;
  }

  state.backgroundLoading = true;


  var tasks = [];


  CONFIG.sources.forEach(
    function(source){

      for(
        var page = 2;
        page <= CONFIG.maxPages;
        page++
      ){

        tasks.push(
          loadPage(
            source,
            page
          )
        );

      }

    }
  );


  Promise.all(tasks)
    .then(function(results){

      var more = [];


      results.forEach(
        function(items){

          more =
            more.concat(items);

        }
      );


      state.items =
        dedupe(
          state.items.concat(more)
        );


      render();

    })
    .finally(function(){

      state.backgroundLoading =
        false;

    });

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value){

  if(!value){
    return "";
  }

  try{

    var date =
      new Date(value);

    return date.toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch(e){

    return "";

  }

}


/* =========================================================
   FILTER ITEMS
   ========================================================= */

function getFilteredItems(){

  var query =
    state.query
      .toLowerCase()
      .trim();


  return state.items.filter(
    function(item){

      if(
        state.filter !== "all" &&
        item.kind !== state.filter
      ){

        return false;

      }


      if(!query){
        return true;
      }


      var haystack =
        (
          item.title +
          " " +
          item.content +
          " " +
          item.vj
        )
        .toLowerCase();


      return haystack.indexOf(query) !== -1;

    }
  );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(
    value == null ? "" : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   SAVE / FAVORITES
   ========================================================= */

function getSaved(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "m2a_saved_movies"
      ) || "[]"
    );

  }catch(e){

    return [];

  }

}


function isSaved(id){

  return getSaved().indexOf(id) !== -1;

}


function toggleSave(id){

  var saved =
    getSaved();

  var index =
    saved.indexOf(id);


  if(index === -1){

    saved.push(id);

  }else{

    saved.splice(index,1);

  }


  try{

    localStorage.setItem(
      "m2a_saved_movies",
      JSON.stringify(saved)
    );

  }catch(e){}

}


/* =========================================================
   RENDER CATALOG
   ========================================================= */

function render(){

  var filtered =
    getFilteredItems();


  countBox.textContent =
    filtered.length +
    " titles";


  if(!filtered.length){

    catalog.innerHTML =
      '<div class="m2a-empty">' +
      'No movies or series found.' +
      '</div>';

    bindCardClicks([]);

    return;

  }


  var html = "";


  filtered.forEach(
    function(item,index){

      if(
        index > 0 &&
        index % CONFIG.adEvery === 0
      ){

        html +=
          '<div class="m2a-ad-card">' +

            '<span class="ad-label">Advertisement</span>' +

            '<ins class="adsbygoogle"' +

              ' style="display:block;width:100%;"' +

              ' data-ad-client="ca-pub-2269884583846743"' +

              ' data-ad-slot="2906167922"' +

              ' data-ad-format="auto"' +

              ' data-full-width-responsive="true"' +

            '></ins>' +

          '</div>';

      }


      var saved =
        isSaved(item.id);


      var title =
        escapeHtml(item.title);


      var image =
        item.image
          ? escapeHtml(item.image)
          : "";


      var vj =
        item.vj
          ? escapeHtml(item.vj)
          : "";


      html +=

        '<article class="m2a-card" ' +

          'data-post-id="' +
          escapeHtml(item.id) +
          '"' +

        '>' +

          '<div class="m2a-poster">' +

            (
              image

              ?

              '<img ' +
                'src="' + image + '"' +
                'alt="' + title + '"' +
                'loading="lazy"' +
                'decoding="async"' +
                'fetchpriority="low"' +
                'referrerpolicy="no-referrer"' +
              '>'

              :

              '<div style="' +
                'width:100%;height:100%;' +
                'display:flex;' +
                'align-items:center;' +
                'justify-content:center;' +
                'color:#d8d5c8;' +
                'font-size:12px;' +
              '">' +
                'No Poster' +
              '</div>'
            ) +

            '<span class="m2a-badge">' +
              (
                item.kind === "series"
                  ? "SERIES"
                  : "FIRIMU"
              ) +
            '</span>' +

            '<button ' +
              'type="button" ' +
              'class="m2a-save' +
              (saved ? ' saved' : '') +
              '" ' +
              'data-save-id="' +
              escapeHtml(item.id) +
              '" ' +
              'aria-label="Save">' +
              (
                saved
                  ? "★"
                  : "☆"
              ) +
            '</button>' +

            '<div class="m2a-card-overlay">' +
              '<div class="m2a-play">▶</div>' +
            '</div>' +

          '</div>' +

          '<div class="m2a-card-info">' +

            '<div class="m2a-card-title">' +
              title +
            '</div>' +

            '<div class="m2a-card-meta">' +

              '<span class="m2a-vj">' +
                (
                  vj
                    ? "VJ " + vj
                    : (
                        item.kind === "series"
                          ? "Series"
                          : "Movie"
                      )
                ) +
              '</span>' +

              (
                item.year

                ?

                '<span class="m2a-year">' +
                  escapeHtml(item.year) +
                '</span>'

                :

                ''
              ) +

            '</div>' +

          '</div>' +

        '</article>';

    }
  );


  catalog.innerHTML =
    html;


  bindCardClicks(filtered);

  bindSaveButtons();

  lazyAds();


  /*
   * If the browser currently contains a post hash,
   * keep the opened post active after background feed
   * rendering.
   */

  syncPostFromHash();

}


/* =========================================================
   BIND CARD CLICKS
   ========================================================= */

function bindCardClicks(items){

  var cards =
    catalog.querySelectorAll(
      ".m2a-card"
    );


  cards.forEach(
    function(card){

      card.onclick =
        function(event){

          /*
           * Do not open post when the save button
           * itself was clicked.
           */

          if(
            event.target.closest &&
            event.target.closest(".m2a-save")
          ){

            return;

          }


          var id =
            card.getAttribute(
              "data-post-id"
            );


          var item =
            items.find(
              function(x){
                return x.id === id;
              }
            );


          if(item){

            openPost(item);

          }

        };

    }
  );

}


/* =========================================================
   SAVE BUTTONS
   ========================================================= */

function bindSaveButtons(){

  var buttons =
    catalog.querySelectorAll(
      ".m2a-save"
    );


  buttons.forEach(
    function(button){

      button.onclick =
        function(event){

          event.preventDefault();

          event.stopPropagation();


          var id =
            button.getAttribute(
              "data-save-id"
            );


          toggleSave(id);


          var saved =
            isSaved(id);


          button.classList.toggle(
            "saved",
            saved
          );


          button.textContent =
            saved
              ? "★"
              : "☆";

        };

    }
  );

}


/* =========================================================
   ADSENSE LOADER
   ========================================================= */

var adsenseLoaded = false;


function ensureAdsense(){

  if(adsenseLoaded){
    return;
  }


  if(
    document.querySelector(
      'script[src*="pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]'
    )
  ){

    adsenseLoaded = true;

    return;

  }


  var ads =
    document.createElement("script");


  ads.async = true;


  ads.src =
    "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2269884583846743";


  ads.crossOrigin =
    "anonymous";


  document.head.appendChild(ads);


  adsenseLoaded = true;

}


ensureAdsense();


/* =========================================================
   VIEWABILITY-OPTIMIZED ADSENSE PUSH
   Ads are only requested when they scroll near the viewport.
   This raises viewability %, which raises CPM/bids, and
   prevents "max 3 ads on screen" style throttling issues.
   ========================================================= */

var adObserver = null;


if("IntersectionObserver" in window){

  adObserver =
    new IntersectionObserver(
      function(entries){

        entries.forEach(
          function(entry){

            if(
              !entry.isIntersecting
            ){
              return;
            }


            var ad =
              entry.target;


            adObserver.unobserve(ad);

            activateAd(ad);

          }
        );

      },
      {
        rootMargin:"300px 0px"
      }
    );

}


function activateAd(ad){

  if(
    ad.getAttribute(
      "data-m2a-loaded"
    ) === "1"
  ){

    return;

  }


  /*
   * Mark before pushing so repeated renders
   * do not duplicate the same ad request.
   */

  ad.setAttribute(
    "data-m2a-loaded",
    "1"
  );


  try{

    (
      window.adsbygoogle =
      window.adsbygoogle || []
    ).push({});

  }catch(e){}

}


function lazyAds(){

  var ads =
    document.querySelectorAll(
      "ins.adsbygoogle"
    );


  ads.forEach(
    function(ad){

      if(
        ad.getAttribute(
          "data-m2a-loaded"
        ) === "1"
      ){

        return;

      }


      if(adObserver){

        adObserver.observe(ad);

      }else{

        activateAd(ad);

      }

    }
  );

}


/* =========================================================
   FIND ITEM BY ID
   ========================================================= */

function findItem(id){

  return state.items.find(
    function(item){

      return item.id === id;

    }
  );

}


/* =========================================================
   OPEN POST
   ========================================================= */

function openPost(item){

  if(!item){
    return;
  }


  state.previousScroll =
    window.pageYOffset ||
    document.documentElement.scrollTop ||
    0;


  state.viewing =
    item;


  document.body.classList.add(
    "m2a-viewing-post"
  );


  postView.classList.add(
    "show"
  );


  /*
   * Hash allows the opened article to be
   * restored with browser navigation.
   */

  if(
    window.location.hash !==
    "#" + item.id
  ){

    history.pushState(
      {
        m2aPost:item.id
      },
      "",
      "#" + item.id
    );

  }


  /*
   * Immediately show a lightweight loading
   * state before fetching the full post.
   */

  postView.innerHTML =
    '<div class="m2a-post-loading">' +

      '<div class="m2a-spinner"></div>' +

      '<div>Loading post...</div>' +

    '</div>';


  postView.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });


  fetchPost(item);

}


/* =========================================================
   CLOSE POST
   ========================================================= */

function closePost(scrollBack){

  state.viewing =
    null;


  postView.classList.remove(
    "show"
  );


  postView.innerHTML =
    "";


  document.body.classList.remove(
    "m2a-viewing-post"
  );


  if(
    window.location.hash
  ){

    history.pushState(
      { },
      "",
      window.location.pathname +
      window.location.search
    );

  }


  if(scrollBack){

    setTimeout(
      function(){

        window.scrollTo(
          0,
          state.previousScroll || 0
        );

      },
      30
    );

  }

}


/* =========================================================
   FETCH INDIVIDUAL POST
   ========================================================= */

function fetchPost(item){

  if(!item || !item.id){
    return;
  }


  var id =
    item.id
      .replace(/^post-/,"");


  var url =
    item.sourceUrl +
    "/feeds/posts/default/" +
    encodeURIComponent(id) +
    "?alt=json-in-script";


  jsonp(url)
    .then(
      function(data){

        var entry =
          data &&
          data.entry
            ? data.entry
            : null;


        if(!entry){

          throw new Error(
            "Post not found"
          );

        }


        renderPostContent(
          entry,
          item
        );

      }
    )
    .catch(
      function(){

        postView.innerHTML =

          '<div class="m2a-error">' +

            '<strong>Unable to load this post.</strong>' +

            '<br><br>' +

            'Please try again.' +

          '</div>';

      }
    );

}


/* =========================================================
   GET RAW POST HTML
   ========================================================= */

function getRawPostHtml(entry){

  if(
    entry.content &&
    entry.content.$t
  ){

    return entry.content.$t;

  }


  if(
    entry.summary &&
    entry.summary.$t
  ){

    return entry.summary.$t;

  }


  return "";

}


/* =========================================================
   INSERT MID-ARTICLE ADS
   Inserts large rectangle ad units between post content
   blocks every N elements (max 3). High CPM placements
   that stay well separated from the video player.
   ========================================================= */

function insertMidPostAds(){

  var body =
    postView.querySelector(
      ".m2a-post-body"
    );

  if(!body){
    return;
  }


  var nodes =
    Array.prototype.slice.call(
      body.children
    );


  if(nodes.length < 8){

    /*
     * Very short posts: no mid-article ads
     * (avoids ad-density policy issues).
     */

    return;

  }


  var step = 6;

  var inserted = 0;

  var maxAds = 3;


  for(
    var i = step - 1;
    i < nodes.length - 1 &&
    inserted < maxAds;
    i += step
  ){

    var node =
      nodes[i];


    var adBox =
      document.createElement(
        "div"
      );


    adBox.className =
      "m2a-post-ad m2a-mid-ad";


    adBox.innerHTML =
      '<span class="ad-label">Advertisement</span>' +

      '<ins class="adsbygoogle"' +

        ' style="display:block; text-align:center;"' +

        ' data-ad-client="ca-pub-2269884583846743"' +

        ' data-ad-slot="2906167922"' +

        ' data-ad-format="auto"' +

        ' data-full-width-responsive="true"' +

      '></ins>';


    if(
      node.parentNode
    ){

      node.parentNode.insertBefore(
        adBox,
        node.nextSibling
      );

      inserted++;

    }

  }

}


/* =========================================================
   RENDER FULL POST
   ========================================================= */

function renderPostContent(
  entry,
  item
){

  var html =
    getRawPostHtml(entry);


  var title =
    entry.title &&
    entry.title.$t
      ? entry.title.$t
      : item.title;


  var published =
    entry.published &&
    entry.published.$t
      ? entry.published.$t
      : item.published;


  var image =
    extractImage(entry,"s1000");


  var safeTitle =
    escapeHtml(title);


  var safeDate =
    escapeHtml(
      formatDate(published)
    );


  /*
   * Keep the raw Blogger HTML intact.
   * This is important because the post may contain
   * custom video players, buttons, embeds and links.
   */

  postView.innerHTML =

    '<div class="m2a-post-toolbar">' +

      '<button ' +
        'type="button" ' +
        'class="m2a-back-btn"' +
      '>' +

        '← Back to catalog' +

      '</button>' +

    '</div>' +


    '<div class="m2a-post-hero">' +

      (
        image

        ?

        '<img ' +
          'class="m2a-post-poster" ' +
          'src="' +
            escapeHtml(image) +
          '" ' +
          'alt="' +
            safeTitle +
          '" ' +
          'decoding="async"' +
        '>'

        :

        ''
      ) +

      '<h1 class="m2a-post-title">' +
        safeTitle +
      '</h1>' +

      '<div class="m2a-post-meta">' +

        (
          item.kind === "series"
            ? "Series"
            : "Firimu"
        ) +

        (
          safeDate
            ? " • " + safeDate
            : ""
        ) +

      '</div>' +

    '</div>' +


    /*
     * FIRST IN-POST ADSENSE (below hero, above content)
     */

    '<div class="m2a-post-ad">' +

      '<span class="ad-label">Advertisement</span>' +

      '<ins class="adsbygoogle"' +

        ' style="display:block"' +

        ' data-ad-client="ca-pub-2269884583846743"' +

        ' data-ad-slot="2906167922"' +

        ' data-ad-format="auto"' +

        ' data-full-width-responsive="true"' +

      '></ins>' +

    '</div>' +


    /*
     * ACTUAL POST BODY
     */

    '<div class="m2a-post-body">' +

      html +

    '</div>' +


    /*
     * BOTTOM IN-POST AD (before user returns to catalog)
     */

    '<div class="m2a-post-ad">' +

      '<span class="ad-label">Advertisement</span>' +

      '<ins class="adsbygoogle"' +

        ' style="display:block"' +

        ' data-ad-client="ca-pub-2269884583846743"' +

        ' data-ad-slot="2906167922"' +

        ' data-ad-format="auto"' +

        ' data-full-width-responsive="true"' +

      '></ins>' +

    '</div>' +


"";


  /*
   * Insert mid-article ads between content blocks.
   */

  insertMidPostAds();


  /*
   * Bind the back button after rendering.
   */

  var back =
    postView.querySelector(
      ".m2a-back-btn"
    );


  if(back){

    back.onclick =
      function(){

        closePost(true);

      };

  }


  /*
   * Activate any video / custom content
   * scripts that listen for DOM changes.
   */

  try{

    document.dispatchEvent(
      new CustomEvent(
        "m2a:postloaded",
        {
          detail:{
            item:item,
            entry:entry
          }
        }
      )
    );

  }catch(e){}


  /*
   * Render the newly created AdSense units.
   */

  lazyAds();


  /*
   * Make sure the reader starts at the
   * beginning of the opened article.
   */

  setTimeout(
    function(){

      postView.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    },
    40
  );

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch(){

  if(!searchInput){
    return;
  }


  var searchTimer;


  searchInput.addEventListener(
    "input",
    function(){

      clearTimeout(searchTimer);


      searchTimer =
        setTimeout(
          function(){

            state.query =
              searchInput.value || "";


            render();

          },
          120
        );

    }
  );

}


/* =========================================================
   TABS
   ========================================================= */

function setupTabs(){

  var tabs =
    document.querySelectorAll(
      ".m2a-tab"
    );


  tabs.forEach(
    function(tab){

      tab.addEventListener(
        "click",
        function(){

          tabs.forEach(
            function(t){

              t.classList.remove(
                "active"
              );

            }
          );


          tab.classList.add(
            "active"
          );


          state.filter =
            tab.getAttribute(
              "data-filter"
            ) || "all";


          render();

        }
      );

    }
  );

}


/* =========================================================
   HASH / BROWSER NAVIGATION
   ========================================================= */

function syncPostFromHash(){

  var hash =
    window.location.hash;


  if(!hash){
    return;
  }


  var id =
    decodeURIComponent(
      hash.substring(1)
    );


  if(
    !id ||
    id.indexOf("post-") !== 0
  ){

    return;

  }


  var item =
    findItem(id);


  if(item){

    /*
     * Avoid repeatedly re-fetching the same post
     * during background catalog rendering.
     */

    if(
      state.viewing &&
      state.viewing.id === id &&
      postView.classList.contains("show")
    ){

      return;

    }


    state.viewing =
      item;


    document.body.classList.add(
      "m2a-viewing-post"
    );


    postView.classList.add(
      "show"
    );


    fetchPost(item);

  }

}


function setupPostView(){

  window.addEventListener(
    "popstate",
    function(){

      if(
        window.location.hash
      ){

        syncPostFromHash();

      }else{

        closePost(false);

      }

    }
  );


  window.addEventListener(
    "hashchange",
    function(){

      if(
        window.location.hash
      ){

        syncPostFromHash();

      }else{

        closePost(false);

      }

    }
  );


  document.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape" &&
        state.viewing
      ){

        closePost(true);

      }

    }
  );


  /*
   * If page loads directly with #post-ID,
   * wait until the catalog is available.
   */

  setTimeout(
    function(){

      syncPostFromHash();

    },
    300
  );

}


/* =========================================================
   STICKY BOTTOM ANCHOR AD
   Policy compliant manual anchor:
   - shown only after user scrolls (engaged visit)
   - fixed 60-70px height, never covers content
   - clear close button, dismissed for the session
   - sits BELOW the sticky search controls in z-order
   ========================================================= */

function setupAnchorAd(){

  var box =
    document.getElementById(
      "m2a-anchor-ad"
    );

  var closeBtn =
    document.getElementById(
      "m2a-anchor-close"
    );


  if(!box){
    return;
  }


  var dismissed = false;

  try{

    dismissed =
      sessionStorage.getItem(
        "m2a_anchor_closed"
      ) === "1";

  }catch(e){}


  if(closeBtn){

    closeBtn.onclick =
      function(){

        box.classList.remove(
          "show"
        );


        document.body.classList.remove(
          "m2a-anchor-visible"
        );


        try{

          sessionStorage.setItem(
            "m2a_anchor_closed",
            "1"
          );

        }catch(e){}

      };

  }


  if(dismissed){
    return;
  }


  var shown = false;


  function maybeShow(){

    if(shown){
      return;
    }


    var scrolled =
      window.pageYOffset ||
      document.documentElement.scrollTop ||
      0;


    /*
     * Only show after the visitor scrolls 300px —
     * proves engagement and protects viewability.
     */

    if(scrolled < 300){
      return;
    }


    shown = true;


    box.classList.add(
      "show"
    );


    document.body.classList.add(
      "m2a-anchor-visible"
    );


    lazyAds();


    window.removeEventListener(
      "scroll",
      maybeShow
    );

  }


  window.addEventListener(
    "scroll",
    maybeShow,
    {
      passive:true
    }
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

function setup(){

  setupSearch();

  setupTabs();

  setupPostView();

  setupAnchorAd();

  loadFirstPages();

}


/* =========================================================
   START
   ========================================================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    setup
  );

}else{

  setup();

}

})();
