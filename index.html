function jsonp(url){
  return new Promise(function(resolve,reject){
    var cb="m2a_jp_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    var script=document.createElement("script");

    var text=stripHtml(html);

    var item={
      id:extractId(entry),
      title:title,
      image:imageAt(entry,"w400"),
      imageSmall:imageAt(entry,"w200"),
      content:text,               /* plain text — used for search only */
      sourceUrl:source.url,
      kind:source.kind,
      year:year,
      published:published,
      vj:""
    };

    var combined=title+" "+text;
    var vjMatch=combined.match(/\b(?:kali\s+mu|vj)\s+([A-Za-z0-9 _.-]{2,40})/i);
    if(vjMatch){
      item.vj=vjMatch[1].replace(/\s+/g," ").trim();
    }

    return item;
  });
}

/* ================= FEED PAGES ================= */
function loadPage(source,page){
  var url=source.url+"/feeds/posts/default?alt=json-in-script&max-results="+
          CONFIG.pageSize+"&start-index="+(((page-1)*CONFIG.pageSize)+1);
  return jsonp(url).then(function(data){
    return convertEntries(data,source);
  }).catch(function(){return [];});
}

function dedupe(items){
  var seen=new Set();
  var out=[];
  items.forEach(function(it){
    var key=it.sourceUrl+"|"+it.id;
    if(seen.has(key))return;
    seen.add(key);
    out.push(it);
  });
  return out;
}

/* ================= FIRST PAGES ================= */
function loadFirstPages(){
  Promise.all(CONFIG.sources.map(function(s){return loadPage(s,1);}))
  .then(function(results){
    var merged=[];
    results.forEach(function(items){merged=merged.concat(items);});
    state.items=dedupe(merged);
    state.loaded=true;
    renderCatalog(true);
    /* schedule background pages during idle time — keeps first paint fast */
    var idle=window.requestIdleCallback||function(fn){return setTimeout(fn,1500);};
    idle(loadBackgroundPages);
  })
  .catch(function(){
    state.loaded=true;
    renderCatalog(true);
  });
}

/* ================= BACKGROUND PAGES (incremental, no full rebuild) ================= */
function loadBackgroundPages(){
  if(state.backgroundLoading)return;
  state.backgroundLoading=true;

  var tasks=[];
  CONFIG.sources.forEach(function(source){
    for(var page=2;page<=CONFIG.maxPages;page++){
      tasks.push(loadPage(source,page));
    }
  });

  Promise.all(tasks).then(function(results){
    var more=[];
    results.forEach(function(items){more=more.concat(items);});
    var before=state.items.length;
    state.items=dedupe(state.items.concat(more));

    if(state.items.length>before){
      /* If user is filtering/searching, a full rebuild is simpler & safe.
         Otherwise append only the new cards (no jank). Feed stays ad-free. */
      if(state.filter==="all"&&!state.query.trim()){
        renderCatalog(false);
      }else{
        renderCatalog(true);
      }
    }
  }).finally(function(){
    state.backgroundLoading=false;
  });
}

/* ================= FILTER ================= */
function getFilteredItems(){
  var query=state.query.toLowerCase().trim();
  return state.items.filter(function(item){
    if(state.filter!=="all"&&item.kind!==state.filter)return false;
    if(!query)return true;
    var hay=(item.title+" "+item.content+" "+item.vj).toLowerCase();
    return hay.indexOf(query)!==-1;
  });
}

/* ================= ESCAPE ================= */
function escapeHtml(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ================= SAVED ================= */
function getSaved(){
  try{return JSON.parse(localStorage.getItem("m2a_saved_movies")||"[]");}
  catch(e){return [];}
}
function isSaved(id){return getSaved().indexOf(id)!==-1;}
function toggleSave(id){
  var saved=getSaved();
  var i=saved.indexOf(id);
  if(i===-1)saved.push(id);else saved.splice(i,1);
  try{localStorage.setItem("m2a_saved_movies",JSON.stringify(saved));}catch(e){}
}

/* ================= CARD BUILDER (content only — feed is 100% ad-free) ================= */
function buildCard(item){
  var saved=isSaved(item.id);
  var title=escapeHtml(item.title);
  var image=item.image?escapeHtml(item.image):"";
  var imageSmall=item.imageSmall?escapeHtml(item.imageSmall):image;
  var vj=item.vj?escapeHtml(item.vj):"";

  return '<article class="m2a-card" data-post-id="'+escapeHtml(item.id)+'">'+
    '<div class="m2a-poster">'+
      (image
        ? '<img src="'+image+'" srcset="'+imageSmall+' 200w, '+image+' 400w" sizes="(max-width:767px) 50vw, 20vw" alt="'+title+'" loading="lazy" decoding="async" fetchpriority="low" referrerpolicy="no-referrer">'
        : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#d8d5c8;font-size:12px;">No Poster</div>')+
      '<span class="m2a-badge">'+(item.kind==="series"?"SERIES":"FIRIMU")+'</span>'+
      '<button type="button" class="m2a-save'+(saved?" saved":"")+'" data-save-id="'+escapeHtml(item.id)+'" aria-label="Save">'+(saved?"★":"☆")+'</button>'+
      '<div class="m2a-card-overlay"><div class="m2a-play">▶</div></div>'+
    '</div>'+
    '<div class="m2a-card-info">'+
      '<div class="m2a-card-title">'+title+'</div>'+
      '<div class="m2a-card-meta">'+
        '<span class="m2a-vj">'+(vj?"VJ "+vj:(item.kind==="series"?"Series":"Movie"))+'</span>'+
        (item.year?'<span class="m2a-year">'+escapeHtml(item.year)+'</span>':"")+
      '</div>'+
    '</div>'+
  '</article>';
}

/* ================= RENDER (FEED = 0 ADS) =================
   full=true  : rebuild the whole catalog (filter/search/first load)
   full=false : append ONLY new items (background feed pages) — fast,
                no scroll jump, no layout thrash.                  */
function renderCatalog(full){
  var filtered=getFilteredItems();
  countBox.textContent=filtered.length+" titles";

  if(!filtered.length){
    catalog.innerHTML='<div class="m2a-empty">No movies or series found.</div>';
    renderedIds=new Set();renderedCount=0;
    return;
  }

  var frag=document.createDocumentFragment();
  var bindItems=[];

  if(full){
    catalog.innerHTML="";
    renderedIds=new Set();
    renderedCount=0;
  }

  filtered.forEach(function(item){
    if(renderedIds.has(item.id))return;

    /* FEED IS AD-FREE: cards only, zero ad insertion. */
    frag.appendChild(htmlToNode(buildCard(item)));
    renderedIds.add(item.id);
    renderedCount++;
    bindItems.push(item);
  });

  catalog.appendChild(frag);

  /* Bind clicks via event delegation — no per-card handlers */
  if(full){
    bindCatalogDelegation();
    bindSaveDelegation();
  }

  syncPostFromHash();
}

function htmlToNode(html){
  var t=document.createElement("template");
  t.innerHTML=html.trim();
  return t.content.firstChild;
}

/* ================= EVENT DELEGATION (cheaper than per-card handlers) ================= */
var delegationBound=false;

function bindCatalogDelegation(){
  if(delegationBound)return;
  delegationBound=true;

  catalog.addEventListener("click",function(event){
    var saveBtn=event.target.closest?event.target.closest(".m2a-save"):null;
    if(saveBtn){
      event.preventDefault();
      event.stopPropagation();
      var id=saveBtn.getAttribute("data-save-id");
      toggleSave(id);
      var saved=isSaved(id);
      saveBtn.classList.toggle("saved",saved);
      saveBtn.textContent=saved?"★":"☆";
      return;
    }

    var card=event.target.closest?event.target.closest(".m2a-card"):null;
    if(!card)return;
    var id=card.getAttribute("data-post-id");
    var item=state.items.find(function(x){return x.id===id;});
    if(item)openPost(item);
  });
}

function bindSaveDelegation(){/* handled above via delegation */}

/* ================= ADSENSE VIEWABILITY LOADER =================
   Ads push only when near viewport -> higher viewability -> higher CPM.
   Every <ins> is created FRESH per opened post, so each post gets its
   own ad elements; the observer activates each one exactly once.    */
var adObserver=("IntersectionObserver" in window)
  ? new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting)return;
        adObserver.unobserve(entry.target);
        activateAd(entry.target);
      });
    },{rootMargin:"400px 0px"})
  : null;

function activateAd(ad){
  if(ad.getAttribute("data-m2a-loaded")==="1")return;
  ad.setAttribute("data-m2a-loaded","1");
  try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
}

function lazyAds(){
  var ads=document.querySelectorAll("ins.adsbygoogle:not([data-m2a-loaded])");
  ads.forEach(function(ad){
    if(adObserver)adObserver.observe(ad);
    else activateAd(ad);
  });
}

/* ================= POST OPEN/CLOSE ================= */
function findItem(id){
  return state.items.find(function(item){return item.id===id;});
}

function openPost(item){
  if(!item)return;

  state.previousScroll=window.pageYOffset||document.documentElement.scrollTop||0;
  state.viewing=item;
  document.body.classList.add("m2a-viewing-post");
  postView.classList.add("show");

  if(window.location.hash!=="#"+item.id){
    history.pushState({m2aPost:item.id},"","#"+item.id);
  }

  postView.innerHTML='<div class="m2a-post-loading"><div class="m2a-spinner"></div><div>Loading post...</div></div>';
  postView.scrollIntoView({behavior:"smooth",block:"start"});

  fetchPost(item);
}

function closePost(scrollBack){
  state.viewing=null;
  postView.classList.remove("show");
  postView.innerHTML="";   /* drops this post's ad elements entirely */
  document.body.classList.remove("m2a-viewing-post");

  if(window.location.hash){
    history.pushState({},"",window.location.pathname+window.location.search);
  }

  if(scrollBack){
    setTimeout(function(){
      window.scrollTo(0,state.previousScroll||0);
    },30);
  }
}

/* ================= FETCH POST (cached — cache holds ONLY article content) ================= */
function fetchPost(item){
  if(!item||!item.id)return;

  var cacheKey=item.sourceUrl+"|"+item.id;
  var cached=postCache.get(cacheKey);

  if(cached){
    renderPostContent(cached,item);   /* ads still generated fresh below */
    return;
  }

  var id=item.id.replace(/^post-/,"");
  var url=item.sourceUrl+"/feeds/posts/default/"+encodeURIComponent(id)+"?alt=json-in-script";

  jsonp(url).then(function(data){
    var entry=data&&data.entry?data.entry:null;
    if(!entry)throw new Error("Post not found");
    postCache.set(cacheKey,entry);    /* raw entry only — no ad markup cached */
    renderPostContent(entry,item);
  }).catch(function(){
    postView.innerHTML='<div class="m2a-error"><strong>Unable to load this post.</strong><br><br>Please try again.</div>';
  });
}

function getRawPostHtml(entry){
  if(entry.content&&entry.content.$t)return entry.content.$t;
  if(entry.summary&&entry.summary.$t)return entry.summary.$t;
  return "";
}

function formatDate(value){
  if(!value)return "";
  try{
    return new Date(value).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  }catch(e){return "";}
}

/* ================= FRESH AD BUILDER (new <ins> every call) ================= */
function buildPostAd(){
  var box=document.createElement("div");
  box.className="m2a-post-ad";
  box.innerHTML='<span class="ad-label">Advertisement</span>'+
    '<ins class="adsbygoogle" style="display:block;text-align:center;"'+
    ' data-ad-client="ca-pub-2269884583846743"'+
    ' data-ad-slot="2906167922"'+
    ' data-ad-format="auto"'+
    ' data-full-width-responsive="true"></ins>';
  return box;
}

/* ================= AD #2 — INSIDE CONTENT (long posts only) =================
   Exactly one in-content placement, inserted after the 3rd paragraph,
   only when the article is long enough to be ad-density safe.     */
function insertPostContentAd(){
  var body=postView.querySelector(".m2a-post-body");
  if(!body)return;

  var paras=body.querySelectorAll("p");
  if(paras.length<6)return;   /* short posts: no in-content ad */

  var adBox=buildPostAd();
  adBox.classList.add("m2a-mid-ad");

  var target=paras[2];        /* after the 3rd paragraph */
  if(target&&target.parentNode){
    target.parentNode.insertBefore(adBox,target.nextSibling);
  }
}

/* ================= RENDER FULL POST (2 fresh ads per open) =================
   Structure per opened post:
     header/title  ->  FRESH AD #1  ->  content  ->  AD #2 (long posts)
   renderPostContent() always rebuilds postView.innerHTML, so every
   opened post — cached or not — receives brand-new <ins> elements.   */
function renderPostContent(entry,item){
  var html=getRawPostHtml(entry);
  var title=(entry.title&&entry.title.$t)?entry.title.$t:item.title;
  var published=(entry.published&&entry.published.$t)?entry.published.$t:item.published;
  var image=imageAt(entry,"w1000");

  var safeTitle=escapeHtml(title);
  var safeDate=escapeHtml(formatDate(published));

  postView.innerHTML=
    '<div class="m2a-post-toolbar">'+
      '<button type="button" class="m2a-back-btn">← Back to catalog</button>'+
    '</div>'+
    '<div class="m2a-post-hero">'+
      (image?'<img class="m2a-post-poster" src="'+escapeHtml(image)+'" alt="'+safeTitle+'" decoding="async">':"")+
      '<h1 class="m2a-post-title">'+safeTitle+'</h1>'+
      '<div class="m2a-post-meta">'+
        (item.kind==="series"?"Series":"Firimu")+(safeDate?" • "+safeDate:"")+
      '</div>'+
    '</div>';

  /* FRESH AD #1 — directly below the post header/title area */
  postView.appendChild(buildPostAd());

  /* Content — pure article markup from the raw entry (never cached with ads) */
  var body=document.createElement("div");
  body.className="m2a-post-body";
  body.innerHTML=html;
  postView.appendChild(body);

  /* FRESH AD #2 — inside the content, only for sufficiently long posts */
  insertPostContentAd();

  var back=postView.querySelector(".m2a-back-btn");
  if(back){back.onclick=function(){closePost(true);};}

  try{
    document.dispatchEvent(new CustomEvent("m2a:postloaded",{detail:{item:item,entry:entry}}));
  }catch(e){}

  /* Lazy-load both fresh ads through the existing IntersectionObserver */
  lazyAds();

  setTimeout(function(){
    postView.scrollIntoView({behavior:"smooth",block:"start"});
  },40);
}

/* ================= SEARCH ================= */
function setupSearch(){
  if(!searchInput)return;
  var t;
  searchInput.addEventListener("input",function(){
    clearTimeout(t);
    t=setTimeout(function(){
      state.query=searchInput.value||"";
      renderCatalog(true);
    },150);
  });
}

/* ================= TABS ================= */
function setupTabs(){
  var tabs=document.querySelectorAll(".m2a-tab");
  tabs.forEach(function(tab){
    tab.addEventListener("click",function(){
      tabs.forEach(function(t){t.classList.remove("active");});
      tab.classList.add("active");
      state.filter=tab.getAttribute("data-filter")||"all";
      renderCatalog(true);
    });
  });
}

/* ================= HASH / NAV ================= */
function syncPostFromHash(){
  var hash=window.location.hash;
  if(!hash)return;
  var id=decodeURIComponent(hash.substring(1));
  if(!id||id.indexOf("post-")!==0)return;

  var item=findItem(id);
  if(!item)return;

  if(state.viewing&&state.viewing.id===id&&postView.classList.contains("show"))return;

  state.viewing=item;
  document.body.classList.add("m2a-viewing-post");
  postView.classList.add("show");
  fetchPost(item);
}

function setupPostView(){
  function onNav(){
    if(window.location.hash){syncPostFromHash();}
    else{closePost(false);}
  }
  window.addEventListener("popstate",onNav);
  window.addEventListener("hashchange",onNav);

  document.addEventListener("keydown",function(event){
    if(event.key==="Escape"&&state.viewing){closePost(true);}
  });

  setTimeout(syncPostFromHash,300);
}

/* ================= STICKY ANCHOR AD ================= */
function setupAnchorAd(){
  var box=document.getElementById("m2a-anchor-ad");
  var closeBtn=document.getElementById("m2a-anchor-close");
  if(!box)return;

  var dismissed=false;
  try{
    dismissed=sessionStorage.getItem("m2a_anchor_closed")==="1";
  }catch(e){}

  if(closeBtn){
    closeBtn.onclick=function(){
      box.classList.remove("show");
      document.body.classList.remove("m2a-anchor-visible");
      try{sessionStorage.setItem("m2a_anchor_closed","1");}catch(e){}
    };
  }

  if(dismissed)return;

  var shown=false;
  function maybeShow(){
    if(shown)return;
    var scrolled=window.pageYOffset||document.documentElement.scrollTop||0;
    if(scrolled<300)return;      /* engaged-visitor gate = viewability */
    shown=true;
    box.classList.add("show");
    document.body.classList.add("m2a-anchor-visible");
    lazyAds();
    window.removeEventListener("scroll",maybeShow);
  }

  window.addEventListener("scroll",maybeShow,{passive:true});
}

/* ================= INIT ================= */
function setup(){
  setupSearch();
  setupTabs();
  setupPostView();
  setupAnchorAd();
  loadFirstPages();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",setup);
}else{
  setup();
}

})();
</script>

<script>
//<![CDATA[
(function(){
"use strict";

/* =========================================================
   VIDEO SYSTEM — ddr45 marker scanner
   ONE shared MutationObserver (merged for performance)
   ========================================================= */

var seenVideos=new Set();

function scanForVideos(root){
  (root||document).querySelectorAll("img[title]").forEach(function(img){
    var title=img.getAttribute("title");
    if(!title)return;
    if(img.dataset.m2aVideoProcessed==="1")return;

    var match=title.match(/\[\/ddr45\/\]([\s\S]*?)\[\/ddr45\/]/i);
    if(!match)return;

    var url=match[1].trim();
    if(!url)return;

    img.dataset.m2aVideoProcessed="1";
    if(seenVideos.has(url))return;
    seenVideos.add(url);

    buildPlayer(img,url);
  });
}

function buildPlayer(img,url){
  var html="";

  var isVideo=/\.(mp4|webm|ogg|mkv|mov|m4v)(\?.*)?$/i.test(url);
  var isYouTube=url.indexOf("youtube.com")>-1||url.indexOf("youtu.be")>-1;

  if(isVideo){
    html='<video controls controlslist="nodownload noplaybackrate fullscreen" disablepictureinpicture playsinline preload="metadata" allowfullscreen>'+
         '<source src="'+url+'" type="video/mp4"></video>';
  }else if(isYouTube){
    var m=url.match(/(?:v=|youtu\.be\/|youtube\.com\/embed\/)([^&?#]+)/);
    var vid=m?m[1]:"";
    html='<iframe src="https://www.youtube.com/embed/'+vid+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>';
  }else{
    html='<iframe src="'+url+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>';
  }

  var wrap=document.createElement("div");
  wrap.className="video-box";
  wrap.innerHTML='<div class="video-inner">'+html+
    '<button class="ready-play-btn" type="button" aria-label="Play video"></button></div>';

  var parent=img.parentNode;
  if(!parent)return;

  if(parent.tagName==="A"){
    var grand=parent.parentNode;
    if(grand){grand.insertBefore(wrap,parent);parent.remove();}
  }else{
    parent.insertBefore(wrap,img);
  }

  img.style.display="none";

  var video=wrap.querySelector("video");
  var iframe=wrap.querySelector("iframe");
  var btn=wrap.querySelector(".ready-play-btn");

  btn.onclick=function(e){
    e.preventDefault();
    e.stopPropagation();

    if(video){
      video.controls=true;
      video.play().then(function(){
        wrap.classList.add("player-unlocked");
        btn.style.display="none";
      }).catch(function(){
        video.controls=true;
        video.focus();
        wrap.classList.add("player-unlocked");
        btn.style.display="none";
      });
    }

    if(iframe){
      var src=iframe.getAttribute("src");
      if(src&&src.indexOf("autoplay=1")===-1){
        iframe.src=src+(src.indexOf("?")>-1?"&":"?")+"autoplay=1";
      }
      wrap.classList.add("player-unlocked");
      btn.style.display="none";
    }
  };

  if(video){
    video.controls=true;
    video.addEventListener("play",function(){
      wrap.classList.add("player-unlocked");
      btn.style.display="none";
    });
    video.addEventListener("pause",function(){
      if(!video.ended){btn.style.display="flex";}
    });
    video.addEventListener("loadedmetadata",function(){video.controls=true;});
    video.addEventListener("canplay",function(){video.controls=true;});
  }

  wrap.oncontextmenu=function(e){e.preventDefault();};
}

function startVideoSystem(){
  scanForVideos();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",startVideoSystem);
}else{
  startVideoSystem();
}

/* Scan inside dynamically loaded posts */
document.addEventListener("m2a:postloaded",function(){
  setTimeout(function(){scanForVideos(postView);},50);
});
var postViewEl=document.getElementById("m2a-post-view");

/* Single debounced observer for ALL dynamic content */
var scanTimer=null;
var observer=new MutationObserver(function(mutations){
  if(scanTimer)return;
  scanTimer=setTimeout(function(){
    scanTimer=null;
    for(var i=0;i<mutations.length;i++){
      var nodes=mutations[i].addedNodes;
      for(var j=0;j<nodes.length;j++){
        if(nodes[j].nodeType===1)scanForVideos(nodes[j].parentNode||document);
      }
    }
  },500);
});
observer.observe(document.body,{childList:true,subtree:true});

})();
//]]>
</script>
